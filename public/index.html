<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明智将棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 待機室 -->
        <div id="lobby-screen">
            <h1>明智将棋 - 待機室</h1>
            <div class="room-container">
                <div class="player-box">
                    <h3>プレイヤー 1</h3>
                    <p id="p1-name">（空き）</p>
                </div>
                <div class="player-box">
                    <h3>プレイヤー 2</h3>
                    <p id="p2-name">（空き）</p>
                </div>
                <div class="spectator-box">
                    <h3>観戦者一覧</h3>
                    <ul id="spectator-list"></ul>
                </div>
            </div>
            <div class="action-buttons">
                <button onclick="joinPlayer()">参加する</button>
                <button onclick="joinSpectator()">観戦する</button>
                <button onclick="leaveRoom()">抜ける</button>
                <button id="btn-start" onclick="startGame()" style="display:none;" class="start-btn">対戦開始！</button>
            </div>
        </div>

        <!-- 対局画面 -->
        <div id="game-screen" style="display: none;">
            <h2 id="game-status">ゲーム準備中...</h2>
            <button id="btn-return-lobby" onclick="returnToLobby()" class="return-btn" style="display: none;">ゲーム終了（ルームに戻る）</button>

            <!-- 初期配置用パレット -->
            <div id="setup-palette" style="display: none;" class="palette">
                <p>手持ちの駒を選び、手前1段の空きマスに配置してください：</p>
                <div id="palette-pieces"></div>
                <br>
                <button id="btn-confirm-setup" onclick="confirmSetup()" class="confirm-btn" disabled>準備完了</button>
            </div>

            <!-- メイン対局エリア（盤面 + インフォメーション） -->
            <div class="game-layout">
                <!-- 左〜中央：相手持ち駒・盤面・自分持ち駒 -->
                <div class="board-container">
                    <div id="enemy-hand-container" class="hand-box" style="display: none;">
                        <span>相手の持ち駒：</span>
                        <span id="enemy-hand-pieces">なし</span>
                    </div>

                    <div id="board"></div>

                    <div id="my-hand-container" class="hand-box" style="display: none;">
                        <span>自分の持ち駒：</span>
                        <span id="my-hand-pieces">なし</span>
                    </div>
                </div>

                <!-- 右側：インフォメーションパネル -->
                <div id="info-panel" class="info-box">
                    <h3>駒情報</h3>
                    <div id="info-content" class="info-empty">
                        <p>駒をクリックすると<br>ここに詳細が表示されます</p>
                    </div>
                </div>
            </div>

            <!-- 画面下部：スキル発動操作エリア -->
            <div id="skill-control-wrapper">
                <div id="skill-control" style="display: none;" class="skill-box">
                    <span id="skill-desc"></span>
                    <button id="btn-use-skill" onclick="triggerSelectedSkill()" class="skill-btn">スキル発動！</button>
                    <button onclick="cancelSkillSelection()" class="cancel-btn">キャンセル</button>
                </div>
            </div>
        </div>

        <!-- ノブナガのカウンター確認モーダル -->
        <div id="nobunaga-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>第六天魔王</h3>
                <p>相手がスキルを発動しようとしています！<br>ノブナガのスキルで無効化しますか？</p>
                <button onclick="respondNobunaga(true)" class="confirm-btn">無効化する！</button>
                <button onclick="respondNobunaga(false)" class="cancel-btn">見送る</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
